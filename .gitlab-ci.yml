image: node:22-alpine

stages:
  - deploy

deploy_quizlink:
  stage: deploy
  variables:
    CI: "true"

  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_QUIZLINK_KEY" | base64 -d > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -p "$SSH_QUIZLINK_PORT" -H "$SSH_QUIZLINK_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      ssh -i ~/.ssh/id_deploy -p "$SSH_QUIZLINK_PORT" "$SSH_QUIZLINK_USER@$SSH_QUIZLINK_HOST" \
        "sudo -n -u fortune /usr/local/sbin/deploy-quizlink"

  only:
    - main
