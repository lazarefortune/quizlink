image: node:20-alpine

stages:
  - deploy

deploy_quizlink:
  stage: deploy
  variables:
    CI: "true"            # npm non-interactif
  before_script:
    - apk add --no-cache openssh git
    - mkdir -p ~/.ssh
    - echo "$SSH_QUIZLINK_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SSH_QUIZLINK_HOST" >> ~/.ssh/known_hosts

  script:
  - |
    ssh -p "$SSH_QUIZLINK_PORT" "$SSH_QUIZLINK_USER@$SSH_QUIZLINK_HOST" << 'EOF'
    set -e

    echo "Déploiement QuizLink"

    cd /var/www/quizlink

    # Récupération du code
    git reset --hard HEAD
    git pull origin main

    # Installation des dépendances
    pnpm install --frozen-lockfile

    # Prisma
    npx prisma generate
    npx prisma migrate deploy

    # Build
    pnpm run build

    # PM2
    if pm2 list | grep -q quizlink; then
      pm2 reload quizlink
    else
      PORT=3002 pm2 start npm --name quizlink -- start
      pm2 save
    fi

    pm2 list
    EOF


  only:
    - main
